  <link href=" {{ url_for('static', filename='css/signin.css')}} " rel="stylesheet">
  {% set fname = 'img/' + params['login_img'] %}

  <form class="form-signin" action="/dashboard" method="POST">
    <img class="mb-4" src=" {{ url_for('static', filename=fname)}} " alt="admin" width="140" height="140">
    <h1 class="h3 mb-3 font-weight-normal">Admin  Pannel</h1>
    <label for="uname" class="sr-only">Hello</label>
    <input type="text" id="pass" name="uname" class="form-control" placeholder="Enter Username" required autofocus>
    <label for="pass" class="sr-only">Password</label>
    <input type="password" id="pass" name="pass" class="form-control" placeholder="Password" required>
    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Remember me
      </label>
    </div>
    <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
    <p class="mt-5 mb-3 text-muted" style="text-align: center;"&copy;>© {{params['blog-title'] }}</p>
  </form>


  </body>

</html>
