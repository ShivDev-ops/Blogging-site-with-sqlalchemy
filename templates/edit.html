{% extends "layout.html" %}
{% block body %}


<!-- Page Header -->
<header class="masthead" style="background-image: url('{{ url_for ('static', filename='img/about-bg.jpg')}}')">
    <div class="overlay"></div>
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto">
                <div class="site-heading">
                    <h1>Admin Pannel</h1>
                    <span class="subheading">CodingThunder's Control Pannel</span>
                </div>
            </div>
        </div>
    </div>
</header>


<div class="container">
    <h2>Bacic Actions</h2><br>
    <a href="/edit/0"><button class="btn btn-primary">Dashboard</button></a>
    <a href="/edit/0"><button class="btn btn-primary">Log Out</button></a><br>
    <hr>

    <h1>Add/Edit Post</h1>

</div>
<div class="container">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
<form name="sentMessage" id="contactForm" action="/edit/{{post.sno}}" method="POST" novalidate>
    <div class="control-group">
        <div class="form-group floating-label-form-group controls">
            <label>Title</label>
            <input type="text" class="form-control" placeholder="Title" id="title" name="title" required
                data-validation-required-message="Please enter your name." value="{{post.title}}">
            <p class="help-block text-danger"></p>
        </div>
    </div>
    <div class="control-group">
        <div class="form-group floating-label-form-group controls">
            <label>Subheading</label>
            <input type="text" class="form-control" placeholder="Subheading" id="subhead" name="subhead" required
                data-validation-required-message="Please enter your email address." value="{{post.subhead}}">
            <p class="help-block text-danger"></p>
        </div>
    </div>
    <div class="control-group">
        <div class="form-group col-xs-12 floating-label-form-group controls">
            <label>Slug</label>
            <input type="text" class="form-control" placeholder="Slug" id="slug" name="slug" required
                data-validation-required-message="Please enter your phone number." value="{{post.slug}}">
            <p class="help-block text-danger"></p>
        </div>
    </div>
    <div class="control-group">
        <div class="form-group floating-label-form-group controls">
            <label>Content</label>
            <textarea rows="5" class="form-control" placeholder="Content" id="content" name="content" required
                data-validation-required-message="Please enter a message." >{{post.content}}</textarea>
            <p class="help-block text-danger"></p>
        </div>

        <div class="form-group col-xs-12 floating-label-form-group controls">
            <label>Image</label>
            <input type="text" class="form-control" placeholder="Image upload" id="img_file" name="img_file" required
                data-validation-required-message="Please enter your phone number." value="{{post.img_file}}">
            <p class="help-block text-danger"></p>
        </div>
    </div>
    <br>
    <div id="success"></div>
    <button type="submit" class="btn btn-primary" id="sendMessageButton">Submit</button>
</form>
</div>
</div>
</div>



{% endblock %}
