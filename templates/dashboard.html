{% extends "layout.html" %}
{% block body %}


    <!-- Page Header -->
    <header class="masthead" style="background-image: url('{{ url_for ('static', filename='img/about-bg.jpg')}}')">
        <div class="overlay"></div>
        <div class="container">
            <div class="row">
                <div class="col-lg-8 col-md-10 mx-auto">
                    <div class="site-heading">
                        <h1>Admin Pannel</h1>
                        <span class="subheading">CodingThunder's Control Pannel</span>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <div class="container">
        
        <h2>Bacic Actions</h2><br>
        <a href="/edit/0"><button class="btn btn-primary">Add a New Post</button></a>
        <a href="/edit/0"><button class="btn btn-primary">Log Out</button></a><br>
        <hr>

        <h3>Upload a File</h3>
        <form action="/uploader" method="POST">
        <input type="file" name="File1">
        <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <hr>

    <table class="table table-striped">
        <thead>
          <tr>
            <th>Serial No.</th>
            <th>Title</th>
            <th>Date</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
            {% for post in posts %} 
            <tr>
            <td>{{post.sno}}</td>
            <td>{{post.title}}</td>
            <td>{{post.date}}</td>
            <td><a href="/edit/{{post.sno}}"><button class="btn btn-primary">Edit</button></td></a>
            <td><button class="btn btn-primary">Delete</button></td>    
            </tr>
            {% endfor %}
      </table>
      </div>
      
                
      
{% endblock %}
